<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conversor de Moneda</title>
</head>
<body>

    <h2>Conversor de Euros y Dólares</h2>

    <form action="conversio.php" method="POST">
        <label for="cantidad">Cantidad:</label>
        <input type="number" step="0.01" min="0.01" name="cantidad" id="cantidad" required placeholder="Ej: 10.50">
        
        <br><br>

        <label for="tipo">Tipo de conversión:</label>
        <select name="tipo" id="tipo" required>
            <option value="eur_a_usd">Euros a Dólares ($)</option>
            <option value="usd_a_eur">Dólares a Euros (€)</option>
        </select>

        <br><br>

        <button type="submit">Convertir</button>
    </form>

</body>
</html>
